name: Kitchen Duty Rotation

on:
  schedule:
    - cron: "0 13 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post-rotation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rotation script
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python kitchen_duty.py

      - name: Commit updated state
        run: |
          git config user.name "kitchen-duty-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update rotation state"
          git push
