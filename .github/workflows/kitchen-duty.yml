name: Kitchen Duty Rotation

on:
  schedule:
    # 13:00 UTC = 14:00 Berlin time in winter (CET) / 15:00 in summer (CEST).
    # GitHub cron doesn't adjust for daylight saving — see README for the
    # one-line fix twice a year if you want it exact.
    - cron: "0 13 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (preview only, no post, no state change)"
        type: boolean
        default: false

permissions:
  contents: write  # needed so the workflow can commit the updated state.json

jobs:
  post-rotation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rotation script
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python kitchen_duty.py

      - name: Commit updated state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "kitchen-duty-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update rotation state"
          git push
